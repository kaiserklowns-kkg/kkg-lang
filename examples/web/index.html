<!doctype html>
<meta charset="utf-8">
<title>Klang in the browser</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .2rem; }
  p.sub { margin-top: 0; opacity: .7; font-size: .9rem; }
  ul { list-style: none; padding: 0; border: 1px solid #8884; border-radius: .5rem; }
  li { padding: .55rem .8rem; border-bottom: 1px solid #8882; }
  li:last-child { border-bottom: 0; }
  li.done { opacity: .5; text-decoration: line-through; }
  li.empty { opacity: .5; font-style: italic; }
  .row { display: flex; gap: .5rem; margin: 1rem 0; }
  input { flex: 1; padding: .5rem .7rem; border: 1px solid #8886; border-radius: .4rem;
          background: transparent; color: inherit; font: inherit; }
  button { padding: .5rem .9rem; border: 1px solid #8886; border-radius: .4rem;
           background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: #8882; }
  .status { display: flex; justify-content: space-between; font-size: .85rem; opacity: .75; }
</style>

<h1>Klang in the browser</h1>
<p class="sub">
  Every line below — the state, the rendering, the event handlers — is
  <a href="../web.kkg">examples/web.kkg</a>, compiled to WebAssembly. This page
  contains no application JavaScript.
</p>

<div class="row">
  <input id="entry" placeholder="something to do" autocomplete="off">
  <button id="add">add</button>
</div>

<ul id="list"><li class="empty">loading…</li></ul>

<div class="status">
  <span id="count"></span>
  <span id="message"></span>
</div>

<div class="row">
  <button id="complete">complete first</button>
  <button id="clear">clear done</button>
</div>

<script src="web.js"></script>
